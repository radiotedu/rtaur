name: Build and Release RTAUR

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore RadioTEDU.AutoReset.slnx

    - name: Run Tests
      run: dotnet test RadioTEDU.AutoReset.slnx --no-restore --verbosity normal

    - name: Publish Single-File Executable
      run: >
        dotnet publish src/RadioTEDU.AutoReset/RadioTEDU.AutoReset.csproj 
        -c Release 
        -r win-x64 
        --self-contained false 
        -p:PublishSingleFile=true 
        -p:IncludeNativeLibrariesForSelfExtract=true 
        -o publish/

    - name: Create ZIP Package
      shell: pwsh
      run: |
        Compress-Archive -Path publish/RadioTEDU.AutoReset.exe -DestinationPath publish/RadioTEDU-AutoReset-v1.0.0.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RadioTEDU-AutoReset-Windows-x64
        path: |
          publish/RadioTEDU.AutoReset.exe
          publish/RadioTEDU-AutoReset-v1.0.0.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          publish/RadioTEDU.AutoReset.exe
          publish/RadioTEDU-AutoReset-v1.0.0.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
